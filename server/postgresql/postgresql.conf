# Listen on all container interfaces; Docker only exposes this inside attached networks.
listen_addresses = '*'
port = 5432

# Passwords should be stored as SCRAM hashes.
password_encryption = 'scram-sha-256'

# TLS (also enforced via docker-compose command flags)
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/etc/ssl/postgresql/server.crt'
ssl_key_file = '/etc/ssl/postgresql/server.key'
ssl_ca_file = '/etc/ssl/postgresql/ca.crt'


# Logging
log_connections = on
log_disconnections = on
log_lock_waits = on
log_min_duration_statement = '1000ms'
log_line_prefix = '%m [%p] %u@%d %r %a '
log_error_verbosity = default

# Location of the pg_hba.conf file
hba_file = '/etc/postgresql/pg_hba.conf'
