global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    # Collects server metrics (CPU, RAM, VM Disk)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    # Collects container metrics (CPU/RAM per container)
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "mosquitto-exporter"
    # Collects MQTT broker metrics (number of clients, topics, etc.)
    static_configs:
      - targets: ["mosquitto-exporter:9234"]

  - job_name: "caddy"
    # Collects Caddy server metrics (requests, latency, etc.)
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: "postgres-exporter"
    # Collects PostgreSQL metrics (query performance, connections, etc.)
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "backend"
    # Collects backend application metrics from prometheus_client
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "blackbox_http"
    # Pings web endpoints to see if they return HTTP 200 (OK)
    metrics_path: /probe
    params:
      module: [http_2xx] 
    static_configs:
      - targets:
        - "https://digitaltwin.duckdns.org/"
        - "http://backend:8000/docs"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox_tcp"
    # Checks if a network port is open and reachable (TCP)
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
        - "mqtt:1883"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
