global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "digitaltwin678@gmail.com"
  smtp_auth_username: "digitaltwin678@gmail.com"
  smtp_auth_password_file: "/etc/alertmanager/secrets/smtp_auth_password"
  smtp_require_tls: true

route:
  receiver: "email-user"
  group_by:
    - alertname
    - component
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "email-user"
    email_configs:
      - to: "paco.chrispijn@student.hu.nl"
        send_resolved: true
