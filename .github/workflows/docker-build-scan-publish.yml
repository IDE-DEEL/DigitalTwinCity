name: Reusable Docker Build, Scan and Publish

on:
  workflow_call:
    inputs:
      component:
        description: Component label used in job names, summaries, and artifacts.
        required: true
        type: string
      context:
        description: Docker build context.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path.
        required: true
        type: string
      image_name:
        description: GHCR image name under the repository namespace.
        required: true
        type: string
    outputs:
      image_ref:
        description: Scanned image reference.
        value: ${{ jobs.docker.outputs.image_ref }}
      critical_count:
        description: Number of critical vulnerabilities found.
        value: ${{ jobs.docker.outputs.critical_count }}
      high_count:
        description: Number of high vulnerabilities found.
        value: ${{ jobs.docker.outputs.high_count }}
      medium_count:
        description: Number of medium vulnerabilities found.
        value: ${{ jobs.docker.outputs.medium_count }}

jobs:
  docker:
    name: Build, scan and publish ${{ inputs.component }} image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.scan_tag }}
      critical_count: ${{ steps.overview.outputs.critical_count }}
      high_count: ${{ steps.overview.outputs.high_count }}
      medium_count: ${{ steps.overview.outputs.medium_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${{ steps.repo.outputs.name }}/${{ inputs.image_name }}"
          short_sha="${GITHUB_SHA::7}"
          sha_tag="${image}:sha-${short_sha}"

          {
            echo "tags<<EOF"
            echo "${sha_tag}"
            echo "EOF"
            echo "scan_tag=${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for local scan
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          pull: true
          load: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Run Trivy scan JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.scan_tag }}
          format: json
          output: trivy-report.json
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          cache-dir: .trivycache/

      - name: Build vulnerability overview for developers
        id: overview
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE_REF: ${{ steps.image.outputs.scan_tag }}
        run: |
          set -euo pipefail

          critical_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json)
          high_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json)
          medium_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-report.json)

          {
            printf '# %s image vulnerability overview\n' "$COMPONENT"
            echo
            echo "- Image: ${IMAGE_REF}"
            echo "- Critical: ${critical_count}"
            echo "- High: ${high_count}"
            echo "- Medium: ${medium_count}"
            echo
            echo "## Blocking criteria"
            echo
            echo "- Block release when CRITICAL vulnerabilities are found."
            echo "- HIGH and MEDIUM vulnerabilities are visible and must be triaged."
            echo
            echo "## Top findings"
            echo
            echo "| Severity | Package | Installed | Fixed | Vulnerability |"
            echo "|---|---|---|---|---|"
            jq -r '
              [
                .Results[]?.Vulnerabilities[]?
                | {Severity, PkgName, InstalledVersion, FixedVersion, VulnerabilityID}
              ]
              | sort_by(
                  if .Severity == "CRITICAL" then 0
                  elif .Severity == "HIGH" then 1
                  else 2 end,
                  .PkgName
                )
              | .[:50]
              | .[]
              | "| \(.Severity) | \(.PkgName // "-") | \(.InstalledVersion // "-") | \(.FixedVersion // "-") | \(.VulnerabilityID // "-") |"
            ' trivy-report.json
          } | tee trivy-overview.md >> "$GITHUB_STEP_SUMMARY"

          echo "critical_count=${critical_count}" >> "$GITHUB_OUTPUT"
          echo "high_count=${high_count}" >> "$GITHUB_OUTPUT"
          echo "medium_count=${medium_count}" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy reports and overview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image_name }}-trivy-reports-${{ github.run_number }}
          path: |
            trivy-report.json
            trivy-overview.md
          if-no-files-found: error

      - name: Fail workflow when critical vulnerabilities are found
        if: steps.overview.outputs.critical_count != '0'
        shell: bash
        run: |
          echo "Critical vulnerabilities found: ${{ steps.overview.outputs.critical_count }}"
          echo "See artifact ${{ inputs.image_name }}-trivy-reports-${{ github.run_number }} and the job summary for details."
          exit 1

      - name: Push scanned image to GHCR
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"
