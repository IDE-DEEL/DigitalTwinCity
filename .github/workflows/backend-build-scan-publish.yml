name: Backend Build, Scan and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-build-scan-publish.yml"
      - ".github/workflows/docker-build-scan-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: backend-build-scan-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build, scan and publish backend image
    uses: ./.github/workflows/docker-build-scan-publish.yml
    with:
      component: Backend
      context: ./backend
      dockerfile: ./backend/Dockerfile
      image_name: backend
    secrets: inherit
