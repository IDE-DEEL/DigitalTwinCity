name: Backend Build, Scan and Publish Docker Image

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata with versioning
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy scan (Critical) JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ steps.meta.outputs.version }}"
          format: "json"
          output: "trivy-critical.json"
          exit-code: "0"
          ignore-unfixed: true
          scanners: "vuln,secret,misconfig"
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Run Trivy scan (Medium/High) JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ steps.meta.outputs.version }}"
          format: "json"
          output: "trivy-medium-high.json"
          exit-code: "0"
          ignore-unfixed: true
          scanners: "vuln,secret,misconfig"
          vuln-type: "os,library"
          severity: "MEDIUM,HIGH"

      - name: Build vulnerability overview for developers
        id: overview
        shell: bash
        run: |
          set -euo pipefail

          critical_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-critical.json)
          high_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-medium-high.json)
          medium_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-medium-high.json)

          {
            echo "# Backend image vulnerability overview"
            echo
            echo "- Image: ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ steps.meta.outputs.version }}"
            echo "- Critical: ${critical_count}"
            echo "- High: ${high_count}"
            echo "- Medium: ${medium_count}"
            echo
            echo "## Top findings (prioritize for Dockerfile/base-image updates)"
            echo
            echo "| Severity | Package | Installed | Fixed | Vulnerability |"
            echo "|---|---|---|---|---|"
            jq -r '
              [
                .Results[]?.Vulnerabilities[]?
                | {Severity, PkgName, InstalledVersion, FixedVersion, VulnerabilityID}
              ]
              | sort_by(
                  if .Severity == "CRITICAL" then 0
                  elif .Severity == "HIGH" then 1
                  else 2 end,
                  .PkgName
                )
              | .[:50]
              | .[]
              | "| \(.Severity) | \(.PkgName // "-") | \(.InstalledVersion // "-") | \(.FixedVersion // "-") | \(.VulnerabilityID // "-") |"
            ' trivy-critical.json trivy-medium-high.json
          } | tee trivy-overview.md >> "$GITHUB_STEP_SUMMARY"

          echo "critical_count=${critical_count}" >> "$GITHUB_OUTPUT"
          echo "high_count=${high_count}" >> "$GITHUB_OUTPUT"
          echo "medium_count=${medium_count}" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy reports and overview
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-reports-${{ github.run_number }}
          path: |
            trivy-critical.json
            trivy-medium-high.json
            trivy-overview.md
          if-no-files-found: error

      - name: Fail workflow when critical vulnerabilities are found
        if: steps.overview.outputs.critical_count != '0'
        run: |
          echo "Critical vulnerabilities found: ${{ steps.overview.outputs.critical_count }}"
          echo "See artifact backend-trivy-reports-${{ github.run_number }} and the job summary for details."
          exit 1
