name: Install Tailscale on Server

on:
  workflow_dispatch:
    inputs:
      auth_key:
        description: 'Tailscale Auth Key (optional, if omitted you will need to manually authenticate via CLI)'
        required: false
        type: string

jobs:
  install-tailscale:
    name: Install Tailscale
    runs-on: self-hosted
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ "$DEPLOY_SSH_KEY" == *'\n'* ]]; then
            printf '%b' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Tailscale Installation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          AUTH_KEY: ${{ inputs.auth_key }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10"
          
          # We explicitly pass the AUTH_KEY variable into the SSH session environment
          $SSH_CMD $DEPLOY_USER@$DEPLOY_HOST "AUTH_KEY='${AUTH_KEY}' bash -s" << 'EOF'
            echo "Checking sudo access..."
            if ! sudo -n true 2>/dev/null; then
              echo "No passwordless sudo. Attempting to grant sudo via Docker..."
              if command -v docker >/dev/null; then
                docker run --rm -v /etc/sudoers.d:/host_sudoers.d alpine sh -c "echo \"$(whoami) ALL=(ALL) NOPASSWD: ALL\" > /host_sudoers.d/$(whoami) && chmod 440 /host_sudoers.d/$(whoami)"
                echo "Sudo granted via Docker."
              else
                echo "Docker not found. Cannot escalate privileges."
              fi
            fi

            echo "Downloading and running Tailscale install script..."
            curl -fsSL https://tailscale.com/install.sh | sh
            
            if [ -n "$AUTH_KEY" ]; then
              echo "Authenticating Tailscale..."
              sudo tailscale up --authkey "$AUTH_KEY"
            else
              echo "Tailscale installed."
              echo "No auth key provided, so 'tailscale up' was not run automatically."
              echo "Please connect to the server and run 'sudo tailscale up' manually to complete the setup."
            fi
          EOF
