name: Frontend Build, Scan and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build-scan-publish.yml"
      - ".github/workflows/docker-build-scan-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: frontend-build-scan-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build, scan and publish frontend image
    uses: ./.github/workflows/docker-build-scan-publish.yml
    with:
      component: Frontend
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
      image_name: frontend
    secrets: inherit
