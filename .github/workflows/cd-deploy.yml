name: CD Deploy

on:
  workflow_run:
    workflows:
      - Backend Build, Scan and Publish Docker Image
      - Frontend Build, Scan and Publish Docker Image
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      backend_image:
        description: Immutable backend image to deploy; empty uses sha of selected commit
        required: false
        default: ""
      frontend_image:
        description: Immutable frontend image to deploy; empty uses sha of selected commit
        required: false
        default: ""
      rollback_on_failure:
        description: Roll back to the previous release when healthchecks fail
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: cd-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  upstream-failed:
    name: Fail when upstream CI failed
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Stop deployment
        shell: bash
        run: |
          echo "Upstream workflow '${{ github.event.workflow_run.name }}' finished with conclusion '${{ github.event.workflow_run.conclusion }}'."
          exit 1

  prepare:
    name: Prepare deployment context
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.context.outputs.backend_image }}
      frontend_image: ${{ steps.context.outputs.frontend_image }}
      release_id: ${{ steps.context.outputs.release_id }}
      should_deploy: ${{ steps.context.outputs.should_deploy }}
      source_sha: ${{ steps.context.outputs.source_sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Build deployment context
        id: context
        shell: bash
        env:
          BACKEND_IMAGE_INPUT: ${{ github.event.inputs.backend_image || '' }}
          FRONTEND_IMAGE_INPUT: ${{ github.event.inputs.frontend_image || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY,,}"
          image_ref_is_immutable() {
            local ref="$1"
            local last
            local tag

            if [[ "$ref" == *@sha256:* ]]; then
              return 0
            fi

            last="${ref##*/}"
            if [[ "$last" == *:* ]]; then
              tag="${last##*:}"
              [[ "$tag" =~ ^sha-[0-9a-fA-F]{7,40}$ ]]
              return
            fi

            return 1
          }

          resolve_image() {
            local component="$1"
            local input="$2"
            local default_tag="$3"

            if [[ -z "$input" ]]; then
              printf 'ghcr.io/%s/%s:%s\n' "$repo" "$component" "$default_tag"
            elif [[ "$input" == */* ]]; then
              printf '%s\n' "$input"
            else
              printf 'ghcr.io/%s/%s:%s\n' "$repo" "$component" "$input"
            fi
          }

          resolve_immutable_image() {
            local component="$1"
            local input="$2"
            local default_tag="$3"
            local image

            image="$(resolve_image "$component" "$input" "$default_tag")"
            if ! image_ref_is_immutable "$image"; then
              echo "::error::${component}_image must use an immutable sha-* tag or sha256 digest, got '${image}'."
              exit 1
            fi

            printf '%s\n' "$image"
          }

          should_deploy="true"
          backend_expected="false"
          frontend_expected="false"

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$SOURCE_SHA" || true)"
            if [[ -z "$changed_files" ]]; then
              changed_files="$(git show --format= --name-only "$SOURCE_SHA" || true)"
            fi

            backend_expected="false"
            frontend_expected="false"
            while IFS= read -r file; do
              case "$file" in
                backend/*|.github/workflows/backend-build-scan-publish.yml)
                  backend_expected="true"
                  ;;
                frontend/*|.github/workflows/frontend-build-scan-publish.yml)
                  frontend_expected="true"
                  ;;
              esac
            done <<< "$changed_files"

            check_workflow() {
              local workflow_file="$1"
              local url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&event=push&per_page=20"
              local response
              local status
              local conclusion

              response="$(curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"
              status="$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // "missing"' <<< "$response")"
              conclusion="$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // ""' <<< "$response")"

              printf '%s\t%s\n' "$status" "$conclusion"
            }

            wait_for_expected_workflow() {
              local workflow_file="$1"
              local label="$2"
              local status
              local conclusion

              IFS=$'\t' read -r status conclusion < <(check_workflow "$workflow_file")
              if [[ "$status" != "completed" ]]; then
                echo "${label} workflow is not completed yet for ${SOURCE_SHA}; this deploy run will be skipped."
                should_deploy="false"
                return
              fi

              if [[ "$conclusion" != "success" ]]; then
                echo "${label} workflow finished with conclusion '${conclusion}'."
                exit 1
              fi
            }

            if [[ "$backend_expected" == "true" || "$frontend_expected" == "true" ]]; then
              wait_for_expected_workflow "backend-build-scan-publish.yml" "Backend"
              wait_for_expected_workflow "frontend-build-scan-publish.yml" "Frontend"
            fi

            if [[ "$backend_expected" != "true" && "$frontend_expected" != "true" ]]; then
              echo "No backend or frontend changes detected for ${SOURCE_SHA}; deployment is skipped."
              should_deploy="false"
            fi
          fi

          backend_default_tag="sha-${SOURCE_SHA::7}"
          frontend_default_tag="sha-${SOURCE_SHA::7}"

          backend_image="$(resolve_immutable_image backend "$BACKEND_IMAGE_INPUT" "$backend_default_tag")"
          frontend_image="$(resolve_immutable_image frontend "$FRONTEND_IMAGE_INPUT" "$frontend_default_tag")"
          release_id="sha-${SOURCE_SHA::7}"

          {
            echo "backend_image=${backend_image}"
            echo "frontend_image=${frontend_image}"
            echo "release_id=${release_id}"
            echo "should_deploy=${should_deploy}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy application
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout deployment package
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Copy and run deployment
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          ROLLBACK_ON_FAILURE: ${{ github.event.inputs.rollback_on_failure || 'true' }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          runtime_env="$(mktemp)"
          trap 'rm -f "$runtime_env"' EXIT

          require_deploy_secrets() {
            local missing=()
            local name

            for name in DEPLOY_HOST DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_USER; do
              if [[ -z "${!name:-}" ]]; then
                missing+=("$name")
              fi
            done

            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required environment secret(s): %s\n' "${missing[*]}" >&2
              exit 1
            fi
          }

          load_deployment_context() {
            deploy_root="${DEPLOY_PATH%/}"
            app_env_file="../../shared/.env"
            compose_profiles="monitoring"
            frontend_api_url=""
            healthcheck_urls=""
            releases_to_keep="5"
            release_dir="${deploy_root}/releases/${RELEASE_ID}"
            remote="${DEPLOY_USER}@${DEPLOY_HOST}"
            ssh_args=(-i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          }

          prepare_ssh() {
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            if [[ "$DEPLOY_SSH_KEY" == *'\n'* ]]; then
              printf '%b' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            else
              printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            fi

            chmod 600 ~/.ssh/deploy_key
            if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
              printf 'DEPLOY_SSH_KEY is not a valid unencrypted SSH private key. Store the full private key, including BEGIN/END lines, with line breaks preserved.\n' >&2
              exit 1
            fi

            write_known_hosts
          }

          write_known_hosts() {
            local keyscan_error
            local keyscan_output

            keyscan_error="$(mktemp)"
            keyscan_output="$(mktemp)"

            if ! ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$keyscan_output" 2> "$keyscan_error"; then
              printf 'Could not fetch the SSH host key from DEPLOY_HOST on port %s.\n' "$DEPLOY_PORT" >&2
              printf 'Check that DEPLOY_HOST contains only the hostname/IP, SSH is running, and port %s is reachable from GitHub Actions.\n' "$DEPLOY_PORT" >&2
              sed 's/^/ssh-keyscan: /' "$keyscan_error" >&2
              exit 1
            fi

            if [[ ! -s "$keyscan_output" ]]; then
              printf 'ssh-keyscan returned no host keys for DEPLOY_HOST on port %s.\n' "$DEPLOY_PORT" >&2
              printf 'Check firewall, DNS, SSH port, and whether the server allows connections from GitHub-hosted runners.\n' >&2
              exit 1
            fi

            mv "$keyscan_output" ~/.ssh/known_hosts
            rm -f "$keyscan_error"
          }

          verify_ssh_access() {
            if ! ssh "${ssh_args[@]}" "$remote" "true"; then
              printf "SSH authentication failed for %s. Ensure the public key matching DEPLOY_SSH_KEY is installed in %s's ~/.ssh/authorized_keys.\n" "$remote" "$DEPLOY_USER" >&2
              exit 1
            fi
          }

          load_remote_group() {
            deploy_group="$(ssh "${ssh_args[@]}" "$remote" "id -gn")"
          }

          prepare_remote_directories() {
            if ssh "${ssh_args[@]}" "$remote" "mkdir -p '${release_dir}' '${deploy_root}/shared' '${deploy_root}/state'"; then
              return 0
            fi

            printf "Deployment user %s cannot create directories under DEPLOY_PATH on %s.\n" "$DEPLOY_USER" "$DEPLOY_HOST" >&2
            printf "Prepare the deploy root once on the server, for example:\n" >&2
            printf "  sudo mkdir -p <DEPLOY_PATH>/releases <DEPLOY_PATH>/shared <DEPLOY_PATH>/state\n" >&2
            printf "  sudo chown -R <DEPLOY_USER>:<DEPLOY_USER> <DEPLOY_PATH>\n" >&2
            exit 1
          }

          copy_release_package() {
            scp -r -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes server/. "${remote}:${release_dir}/"
            scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes deploy/remote-deploy.sh "${remote}:${release_dir}/remote-deploy.sh"
            scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes deploy/README.md "${remote}:${release_dir}/DEPLOYMENT.md"
          }

          write_runtime_env() {
            printf '%s=%q\n' "$1" "$2" >> "$runtime_env"
          }

          upload_runtime_env() {
            write_runtime_env APP_ENV_FILE "$app_env_file"
            write_runtime_env BACKEND_IMAGE "$BACKEND_IMAGE"
            write_runtime_env COMPOSE_PROFILES "$compose_profiles"
            write_runtime_env DEPLOY_GROUP "$deploy_group"
            write_runtime_env FRONTEND_API_URL "$frontend_api_url"
            write_runtime_env FRONTEND_IMAGE "$FRONTEND_IMAGE"
            write_runtime_env GHCR_TOKEN "$GHCR_TOKEN"
            write_runtime_env GHCR_USERNAME "$GHCR_USERNAME"
            write_runtime_env HEALTHCHECK_URLS "$healthcheck_urls"
            write_runtime_env RELEASES_TO_KEEP "$releases_to_keep"
            write_runtime_env ROLLBACK_ON_FAILURE "$ROLLBACK_ON_FAILURE"

            scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$runtime_env" "${remote}:${release_dir}/runtime.env"
          }

          run_remote_deploy() {
            local remote_command
            remote_command="set -a; source '${release_dir}/runtime.env'; rm -f '${release_dir}/runtime.env'; set +a; bash '${release_dir}/remote-deploy.sh'"
            ssh "${ssh_args[@]}" "$remote" "bash -lc $(printf '%q' "$remote_command")"
          }

          write_deployment_summary() {
            {
              echo "## Deployment"
              echo
              echo "- Source commit: ${SOURCE_SHA}"
              echo "- Release: ${RELEASE_ID}"
              echo "- Backend image: ${BACKEND_IMAGE}"
              echo "- Frontend image: ${FRONTEND_IMAGE}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          require_deploy_secrets
          load_deployment_context
          prepare_ssh
          verify_ssh_access
          load_remote_group
          prepare_remote_directories
          copy_release_package
          upload_runtime_env
          run_remote_deploy
          write_deployment_summary
