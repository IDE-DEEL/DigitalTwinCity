; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM14
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.embed_txtfiles = include/rfid.json
lib_deps = 
	knolleary/PubSubClient@^2.8
	miguelbalboa/MFRC522@^1.4.12
	madhephaestus/ESP32Servo@^3.0.9
	adafruit/Adafruit MLX90393@^2.0.5
	sparkfun/SparkFun TB6612FNG Motor Driver Library@^1.0.0
	bblanchon/ArduinoJson@^7.4.2

; Pre-build script to validate environment configuration
extra_scripts = pre:scripts/env_mgr.py

; Load configurations from .env file
build_flags = 
	-D_BSD_SOURCE
